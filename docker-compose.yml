services:
  video-downloader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video-downloader-pro
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - FILE_RETENTION_SECONDS=900
      - PROXY_URL=${PROXY_URL:-}
      - USE_RAM_DISK=${USE_RAM_DISK:-false}
    volumes:
      - ./server/cookies.txt:/app/server/cookies.txt:rw
      - ./server/downloads:/app/server/downloads:rw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
