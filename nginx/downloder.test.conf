# ====================================================================
#  Universal Video Downloader Pro - Nginx SSL Reverse Proxy
#  Domain: downloder.test (https://downloder.test)
# ====================================================================

upstream downloader_app {
    server 127.0.0.1:5000;
    keepalive 32;
}

# 1. HTTP to HTTPS Redirection
server {
    listen 80;
    listen [::]:80;
    server_name downloder.test downloader.test;

    return 301 https://$host$request_uri;
}

# 2. HTTPS SSL Server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name downloder.test downloader.test;

    # SSL Certificates
    ssl_certificate /home/sumon/Desktop/Youtube/web-version/certs/downloder.test.crt;
    ssl_certificate_key /home/sumon/Desktop/Youtube/web-version/certs/downloder.test.key;

    # SSL Security & Performance Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 100M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Real-Time Server-Sent Events (SSE) Route
    location ~ ^/api/progress/.+/stream {
        proxy_pass http://downloader_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Media File Streaming & Direct In-Browser Playback
    location ~ ^/api/(download|stream)/ {
        proxy_pass http://downloader_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Main Application Proxy (Frontend & REST Endpoints)
    location / {
        proxy_pass http://downloader_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
