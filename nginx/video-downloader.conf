# ====================================================================
#  Universal Video Downloader Pro - Production Nginx Reverse Proxy
# ====================================================================

# Rate limiting zone (15 requests per second with burst allowance)
limit_req_zone $binary_remote_addr zone=downloader_limit:10m rate=15r/s;

upstream downloader_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;  # Replace with your domain name (e.g. downloader.yourdomain.com)

    # Maximum upload size for cookies / metadata payloads
    client_max_body_size 50M;

    # Gzip compression for high-speed delivery of static assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 1. Real-Time Server-Sent Events (SSE) Streaming Route
    # Buffering MUST be turned off for instant, lag-free progress updates!
    location ~ ^/api/progress/.+/stream {
        proxy_pass http://downloader_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering & cache for SSE streams
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # 2. Large File Streaming & Direct Client Downloads
    location /api/download/ {
        limit_req zone=downloader_limit burst=30 nodelay;

        proxy_pass http://downloader_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable proxy buffering so large files stream directly to client
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # 3. Main Reverse Proxy Route (Frontend + API)
    location / {
        limit_req zone=downloader_limit burst=50 nodelay;

        proxy_pass http://downloader_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
